name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check app scripts tests

      - name: Plugin linter
        run: python -m app.plugin_lint

      - name: Tests
        run: python -m pytest

      - name: Archive size
        run: python scripts/check_archive_size.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Claude plugin validate
        run: bash scripts/claude_validate.sh ./plugins/superstacks
