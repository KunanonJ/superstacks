name: Bug report
description: Report a defect in Superstacks
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you see?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps that do not require secrets or production access.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "6.0.0"
    validations:
      required: true
