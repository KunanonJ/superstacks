# Skill trigger phrases for eval harnesses.

skills:
  verify-loop:
    - before writing code define a deterministic check
    - run the acceptance check red then green
    - paste VERIFY_PASS from the verify runner
    - playwright snapshot console error check without installing
  verification-before-completion:
    - claim the bug is fixed
    - tests pass now
    - ready to open the PR
  ticket-pipeline:
    - run this ticket from discovery to a draft PR
    - which pipeline steps have evidence
  pr:
    - write the pull request body
    - check the PR body sections
  mistake-to-constraint:
    - this mistake keeps happening
    - turn the repeated error into a lint rule
    - add a CONSTRAINTS.md row
  steer-miner:
    - mine these agent transcripts for repeated corrections
    - propose new skills from chat logs
  intake-triage:
    - triage this batch of bug reports
    - write ticket briefs for the coordinator
  gardening:
    - small dead code cleanup
    - lint debt one concern per PR
  sample-review:
    - sample five merged PRs from today
    - propose environment tightenings not per-PR comments
  owner-decisions:
    - can the agent merge this PR
    - before asking the owner a question check what they already decided
    - record the owner's decision before acting on it
    - propose a standing rule from repeated decisions
  ama:
    - make sign-up faster
    - improve the onboarding, you decide how
    - we need something for referrals, not sure what yet
    - fix the dashboard, it feels wrong
    # Should NOT trigger (clear, fully specified; the format has no negative list):
    #   rename the config key retries to max_retries in settings.py and update its two tests
    #   bump the pinned linter to 1.4.2 and rerun the checks
  workflow-profile:
    - what is trust_level
    - who merges two-way door PRs
  interrogate:
    - money movement change
    - schema migration review
  how:
    - explain how this subsystem works before we change it
  test-driven-development:
    - failing test first
    - red green refactor
